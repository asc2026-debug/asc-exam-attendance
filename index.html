<body>

<div class="container">

  <h1>ASC Examination Attendance</h1>

  <div class="card">

    <div class="selection-group">

      <label for="classSelect">

      <select

        MODE
      </label>

      <select
        id="modeSelect"
        onchange="modeChanged()"
        disabled>

        <option value="">

        </option>

      </select>

    </div>

    <div class="selection-group">

      <label for="subjectSelect">

      </label>

      <select
        id="subjectSelect"

        <option value="">
          Select class and mode first
        </option>

      </select>

    </div>


    <div
      id="selectedInfo"
      class="selected-info">

      Select a class, mode and subject before scanning.

    </div>


    <!-- =====================================================
         SCANNER
         ===================================================== -->

    <div id="reader"></div>


    <button
      id="startButton"
      onclick="startScanner()"
      disabled>

      START SCANNER

    </button>


    <button
      id="stopButton"
      onclick="stopScanner()"
      disabled>

      STOP

    </button>


    <button
      id="scanAgainButton"
      onclick="scanAgain()">

      SCAN NEXT STUDENT

    </button>


    <!-- =====================================================
         RESULT
         ===================================================== -->

    <div id="result">

      <div id="resultStatus"></div>


      <div class="details">

        <p>
          <span class="label">
            Admission ID:
          </span>

          <span id="admissionId"></span>
        </p>


        <p>
          <span class="label">
            Name:
          </span>

          <span id="studentName"></span>
        </p>


        <p>
          <span class="label">
            Term:
          </span>

          <span id="term"></span>
        </p>


        <p>
          <span class="label">
            Class:
          </span>

          <span id="className"></span>
        </p>


        <p>
          <span class="label">
            Mode:
          </span>

          <span id="mode"></span>
        </p>


        <p>
          <span class="label">
            Subject:
          </span>

          <span id="subject"></span>
        </p>


        <p id="sessionRow">

          <span class="label">
            Session:
          </span>

          <span id="session"></span>

        </p>


        <p id="sessionTimeRow">

          <span class="label">
            Time:
          </span>

          <span id="sessionTime"></span>

        </p>


        <p>

          <span class="label">
            Message:
          </span>

          <span id="message"></span>

        </p>

      </div>

    </div>

  </div>

</div>


<script>


/* =========================================================
   APPS SCRIPT URL
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyKTErYaZLWhrJgONe1wsbx_bg70mGRttpQxabTQBc7fCPowFkD9d6HjmLFUe4VFHPsaQ/exec";


/* =========================================================
   SCANNER VARIABLES
   ========================================================= */

let scanner = null;

let scannerRunning = false;

let scanLocked = false;


const successSound =
  new Audio("accessgranted.mp3");

const rejectedSound =
  new Audio("accessdenied.mp3");


successSound.preload = "auto";

rejectedSound.preload = "auto";


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    loadAttendanceOptions();

  }
);


/* =========================================================
   GET JSONP FROM APPS SCRIPT
   ========================================================= */

function jsonpRequest(
  url,
  callback
) {

  const callbackName =
    "jsonpCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  window[callbackName] =
    function(data) {

      try {

        callback(data);

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    url +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();


  script.onerror =
    function() {

      delete window[callbackName];

      const scriptElement =
        document.getElementById(
          callbackName
        );

      if (scriptElement) {
        scriptElement.remove();
      }

      callback(null);

    };


  document.body.appendChild(
    script
  );

}


/* =========================================================
   LOAD CLASS + MODE OPTIONS
   ========================================================= */

function loadAttendanceOptions() {

  const classSelect =
    document.getElementById(
      "classSelect"
    );


  classSelect.innerHTML =
    '<option value="">Loading classes...</option>';


  const url =
    APPS_SCRIPT_URL +
    "?api=attendanceOptions";


  jsonpRequest(
    url,
    function(data) {

      if (!data) {

        classSelect.innerHTML =
          '<option value="">Unable to load classes</option>';

        return;

      }


      classSelect.innerHTML =
        '<option value="">Select class</option>';


      const classes =
        data.classes || [];


      classes.forEach(
        function(className) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            className;

          option.textContent =
            className;

          classSelect.appendChild(
            option
          );

        }
      );


      updateStartButton();

    }
  );

}


/* =========================================================
   CLASS CHANGED
   ========================================================= */

function classChanged() {

  const selectedClass =
    document.getElementById(
      "classSelect"
    ).value;


  const modeSelect =
    document.getElementById(
      "modeSelect"
    );


  const subjectSelect =
    document.getElementById(
      "subjectSelect"
    );


  modeSelect.innerHTML =
    '<option value="">Loading modes...</option>';


  modeSelect.disabled = true;


  subjectSelect.innerHTML =
    '<option value="">Select class and mode first</option>';


  subjectSelect.disabled = true;


  updateSelectedInfo();


  if (!selectedClass) {

    modeSelect.innerHTML =
      '<option value="">Select class first</option>';

    updateStartButton();

    return;

  }


  const url =
    APPS_SCRIPT_URL +
    "?api=attendanceOptions" +
    "&selectedClass=" +
    encodeURIComponent(
      selectedClass
    );


  jsonpRequest(
    url,
    function(data) {

      if (!data) {

        modeSelect.innerHTML =
          '<option value="">Unable to load modes</option>';

        updateStartButton();

        return;

      }


      modeSelect.innerHTML =
        '<option value="">Select mode</option>';


      const modes =
        data.modes || [];


      modes.forEach(
        function(mode) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            mode;

          option.textContent =
            mode;

          modeSelect.appendChild(
            option
          );

        }
      );


      modeSelect.disabled =
        false;


      updateStartButton();

    }
  );

}


/* =========================================================
   MODE CHANGED
   ========================================================= */

function modeChanged() {

  const selectedClass =
    document.getElementById(
      "classSelect"
    ).value;


  const selectedMode =
    document.getElementById(
      "modeSelect"
    ).value;


  const subjectSelect =
    document.getElementById(
      "subjectSelect"
    );


  subjectSelect.innerHTML =
    '<option value="">Loading subjects...</option>';


  subjectSelect.disabled =
    true;


  updateSelectedInfo();


  if (
    !selectedClass ||
    !selectedMode
  ) {

    subjectSelect.innerHTML =
      '<option value="">Select class and mode first</option>';

    updateStartButton();

    return;

  }


  const url =
    APPS_SCRIPT_URL +
    "?api=attendanceOptions" +
    "&selectedClass=" +
    encodeURIComponent(
      selectedClass
    ) +
    "&selectedMode=" +
    encodeURIComponent(
      selectedMode
    );


  jsonpRequest(
    url,
    function(data) {

      if (!data) {

        subjectSelect.innerHTML =
          '<option value="">Unable to load subjects</option>';

        updateStartButton();

        return;

      }


      subjectSelect.innerHTML =
        '<option value="">Select subject</option>';


      const subjects =
        data.subjects || [];


      subjects.forEach(
        function(subject) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            subject;

          option.textContent =
            subject;

          subjectSelect.appendChild(
            option
          );

        }
      );


      subjectSelect.disabled =
        false;


      updateSelectedInfo();

      updateStartButton();

    }
  );

}


/* =========================================================
   SUBJECT CHANGED
   ========================================================= */

document
  .getElementById(
    "subjectSelect"
  )
  .addEventListener(
    "change",
    function() {

      updateSelectedInfo();

      updateStartButton();

    }
  );


/* =========================================================
   DISPLAY CURRENT SELECTION
   ========================================================= */

function updateSelectedInfo() {

  const selectedClass =
    document.getElementById(
      "classSelect"
    ).value;


  const selectedMode =
    document.getElementById(
      "modeSelect"
    ).value;


  const selectedSubject =
    document.getElementById(
      "subjectSelect"
    ).value;


  const info =
    document.getElementById(
      "selectedInfo"
    );


  if (
    !selectedClass ||
    !selectedMode ||
    !selectedSubject
  ) {

    info.innerText =
      "Select a class, mode and subject before scanning.";

    return;

  }


  info.innerText =
    "Selected: " +
    selectedClass +
    " | " +
    selectedMode +
    " | " +
    selectedSubject;

}


/* =========================================================
   ENABLE / DISABLE START BUTTON
   ========================================================= */

function updateStartButton() {

  const selectedClass =
    document.getElementById(
      "classSelect"
    ).value;


  const selectedMode =
    document.getElementById(
      "modeSelect"
    ).value;


  const selectedSubject =
    document.getElementById(
      "subjectSelect"
    ).value;


  const startButton =
    document.getElementById(
      "startButton"
    );


  startButton.disabled =
    !selectedClass ||
    !selectedMode ||
    !selectedSubject ||
    scannerRunning;

}


/* =========================================================
   START SCANNER
   ========================================================= */

function startScanner() {

  if (scannerRunning) {
    return;
  }


  const selectedClass =
    document.getElementById(
      "classSelect"
    ).value;


  const selectedMode =
    document.getElementById(
      "modeSelect"
    ).value;


  const selectedSubject =
    document.getElementById(
      "subjectSelect"
    ).value;


  if (
    !selectedClass ||
    !selectedMode ||
    !selectedSubject
  ) {

    alert(
      "Please select Class, Mode and Subject before starting the scanner."
    );

    return;

  }


  scanLocked =
    false;


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgainButton"
  ).style.display =
    "none";


  scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }

  };


  scanner
    .start(
      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(
      function() {

        scannerRunning =
          true;


        document.getElementById(
          "startButton"
        ).disabled =
          true;


        document.getElementById(
          "stopButton"
        ).disabled =
          false;

      }
    )

    .catch(
      function(error) {

        alert(
          "Camera could not be started.\n\n" +
          "Please allow camera access and try again."
        );


        console.error(
          error
        );

      }
    );

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    return Promise.resolve();

  }


  return scanner
    .stop()

    .then(
      function() {

        scannerRunning =
          false;


        document.getElementById(
          "startButton"
        ).disabled =
          false;


        updateStartButton();


        document.getElementById(
          "stopButton"
        ).disabled =
          true;

      }
    )

    .catch(
      function(error) {

        console.error(
          error
        );

      }
    );

}


/* =========================================================
   QR DETECTED
   ========================================================= */

function onScanSuccess(
  decodedText
) {

  if (scanLocked) {
    return;
  }


  scanLocked =
    true;


  stopScanner()
    .then(
      function() {

        showProcessing(
          decodedText
        );


        sendAttendanceScan(
          decodedText
        );

      }
    );

}


/* =========================================================
   QR SCAN FAILURE
   ========================================================= */

function onScanFailure(
  error
) {

  // Normal while camera is searching.

}


/* =========================================================
   SHOW PROCESSING
   ========================================================= */

function showProcessing(
  qrText
) {

  const lines =
    qrText
      .split(/\r?\n/)
      .map(
        function(line) {
          return line.trim();
        }
      );


  document.getElementById(
    "admissionId"
  ).innerText =
    lines[0] || "";


  document.getElementById(
    "studentName"
  ).innerText =
    lines[1] || "";


  document.getElementById(
    "term"
  ).innerText =
    lines[2] || "";


  document.getElementById(
    "className"
  ).innerText =
    lines[3] || "";


  document.getElementById(
    "mode"
  ).innerText =
    lines[4] || "";


  document.getElementById(
    "subject"
  ).innerText =
    document.getElementById(
      "subjectSelect"
    ).value;


  document.getElementById(
    "session"
  ).innerText =
    "";


  document.getElementById(
    "sessionTime"
  ).innerText =
    "";


  document.getElementById(
    "message"
  ).innerText =
    "Checking attendance...";


  const status =
    document.getElementById(
      "resultStatus"
    );


  status.className =
    "processing";


  status.innerText =
    "PROCESSING...";


  document.getElementById(
    "result"
  ).style.display =
    "block";

}


/* =========================================================
   SEND QR TO APPS SCRIPT
   ========================================================= */

function sendAttendanceScan(
  qrText
) {

  const selectedClass =
    document.getElementById(
      "classSelect"
    ).value;


  const selectedMode =
    document.getElementById(
      "modeSelect"
    ).value;


  const selectedSubject =
    document.getElementById(
      "subjectSelect"
    ).value;


  const callbackName =
    "attendanceCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {

        displayAttendanceResult(
          result
        );

      } finally {

        delete window[callbackName];


        const script =
          document.getElementById(
            callbackName
          );


        if (script) {
          script.remove();
        }

      }

    };


  const url =
    APPS_SCRIPT_URL +
    "?api=attendance" +

    "&qrText=" +
    encodeURIComponent(
      qrText
    ) +

    "&selectedClass=" +
    encodeURIComponent(
      selectedClass
    ) +

    "&selectedMode=" +
    encodeURIComponent(
      selectedMode
    ) +

    "&selectedSubject=" +
    encodeURIComponent(
      selectedSubject
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +

    "&_=" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    url;


  script.onerror =
    function() {

      delete window[callbackName];


      const result =
        document.getElementById(
          "resultStatus"
        );


      result.className =
        "rejected";


      result.innerText =
        "CONNECTION ERROR";


      document.getElementById(
        "message"
      ).innerText =
        "Could not contact the attendance system.";


      document.getElementById(
        "scanAgainButton"
      ).style.display =
        "block";

    };


  document
    .body
    .appendChild(
      script
    );

}


/* =========================================================
   DISPLAY ATTENDANCE RESULT
   ========================================================= */

function displayAttendanceResult(
  result
) {

  if (!result) {

    showRejected(
      "No response received from attendance system."
    );

    return;

  }


  const success =
    result.success === true;


  if (success) {

    successSound.currentTime =
      0;


    successSound
      .play()
      .catch(
        function(error) {

          console.log(
            "Success sound could not play:",
            error
          );

        }
      );


    const status =
      document.getElementById(
        "resultStatus"
      );


    status.className =
      "success";


    status.innerText =
      "✓ PRESENT";


    document.getElementById(
      "message"
    ).innerText =
      result.message ||
      "Attendance recorded.";

  }


  else {

    rejectedSound.currentTime =
      0;


    rejectedSound
      .play()
      .catch(
        function(error) {

          console.log(
            "Rejected sound could not play:",
            error
          );

        }
      );


    const status =
      document.getElementById(
        "resultStatus"
      );


    status.className =
      "rejected";


    status.innerText =
      "✗ " +
      (
        result.status ||
        "REJECTED"
      );


    document.getElementById(
      "message"
    ).innerText =
      result.message ||
      "Attendance was not recorded.";

  }


  if (result.admissionId) {

    document.getElementById(
      "admissionId"
    ).innerText =
      result.admissionId;

  }


  if (result.studentName) {

    document.getElementById(
      "studentName"
    ).innerText =
      result.studentName;

  }


  if (result.className) {

    document.getElementById(
      "className"
    ).innerText =
      result.className;

  }


  if (result.modeOfExam) {

    document.getElementById(
      "mode"
    ).innerText =
      result.modeOfExam;

  }


  if (result.subject) {

    document.getElementById(
      "subject"
    ).innerText =
      result.subject;

  }


  if (result.session) {

    document.getElementById(
      "session"
    ).innerText =
      "Session " +
      result.session;

  }


  if (result.sessionTime) {

    document.getElementById(
      "sessionTime"
    ).innerText =
      result.sessionTime;

  }


  document.getElementById(
    "scanAgainButton"
  ).style.display =
    "block";

}


/* =========================================================
   REJECTED RESULT
   ========================================================= */

function showRejected(
  message
) {

  const status =
    document.getElementById(
      "resultStatus"
    );


  status.className =
    "rejected";


  status.innerText =
    "✗ REJECTED";


  document.getElementById(
    "message"
  ).innerText =
    message;


  document.getElementById(
    "scanAgainButton"
  ).style.display =
    "block";

}


/* =========================================================
   SCAN NEXT STUDENT
   ========================================================= */

function scanAgain() {

  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "scanAgainButton"
  ).style.display =
    "none";


  scanLocked =
    false;


  startScanner();

}

</script>

</body>

</html>
