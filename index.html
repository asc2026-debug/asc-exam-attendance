<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASC Examination Attendance</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #stopButton {
      background: #ddd;
      color: #222;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: #eef6ff;
      border-radius: 12px;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    .success {
      color: #16803c;
      font-size: 22px;
      font-weight: bold;
    }

    .rejected {
      color: #b42318;
      font-size: 22px;
      font-weight: bold;
    }

    .processing {
      color: #555;
      font-size: 18px;
      font-weight: bold;
    }

    .details {
      margin-top: 15px;
    }

    .details p {
      margin: 8px 0;
    }

    #scanAgainButton {
      display: none;
      background: #16803c;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>ASC Examination Attendance</h1>

  <div class="subtitle">
    Scan the student's examination pass
  </div>

  <div class="card">

    <div id="reader"></div>

    <button
      id="startButton"
      onclick="startScanner()">
      START SCANNER
    </button>

    <button
      id="stopButton"
      onclick="stopScanner()"
      disabled>
      STOP
    </button>

    <button
      id="scanAgainButton"
      onclick="scanAgain()">
      SCAN NEXT STUDENT
    </button>

    <div id="result">

      <div id="resultStatus"></div>

      <div class="details">

        <p>
          <span class="label">Admission ID:</span>
          <span id="admissionId"></span>
        </p>

        <p>
          <span class="label">Name:</span>
          <span id="studentName"></span>
        </p>

        <p>
          <span class="label">Term:</span>
          <span id="term"></span>
        </p>

        <p>
          <span class="label">Class:</span>
          <span id="className"></span>
        </p>

        <p>
          <span class="label">Mode:</span>
          <span id="mode"></span>
        </p>

        <p id="subjectRow">
          <span class="label">Subject:</span>
          <span id="subject"></span>
        </p>

        <p id="sessionRow">
          <span class="label">Session:</span>
          <span id="session"></span>
        </p>

        <p id="sessionTimeRow">
          <span class="label">Time:</span>
          <span id="sessionTime"></span>
        </p>

        <p>
          <span class="label">Message:</span>
          <span id="message"></span>
        </p>

      </div>

    </div>

  </div>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbyKTErYaZLWhrJgONe1wsbx_bg70mGRttpQxabTQBc7fCPowFkD9d6HjmLFUe4VFHPsaQ/exec";


let scanner = null;
let scannerRunning = false;
let scanLocked = false;


/* =========================================================
   START SCANNER
   ========================================================= */

function startScanner() {

  if (scannerRunning) {
    return;
  }

  scanLocked = false;

  document.getElementById(
    "result"
  ).style.display = "none";

  document.getElementById(
    "scanAgainButton"
  ).style.display = "none";

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    }
  };

  scanner
    .start(
      {
        facingMode: "environment"
      },
      config,
      onScanSuccess,
      onScanFailure
    )
    .then(function() {

      scannerRunning = true;

      document.getElementById(
        "startButton"
      ).disabled = true;

      document.getElementById(
        "stopButton"
      ).disabled = false;

    })
    .catch(function(error) {

      alert(
        "Camera could not be started.\n\n" +
        "Please allow camera access and try again."
      );

      console.error(error);

    });
}


/* =========================================================
   STOP SCANNER
   ========================================================= */

function stopScanner() {

  if (!scanner || !scannerRunning) {
    return Promise.resolve();
  }

  return scanner
    .stop()
    .then(function() {

      scannerRunning = false;

      document.getElementById(
        "startButton"
      ).disabled = false;

      document.getElementById(
        "stopButton"
      ).disabled = true;

    })
    .catch(function(error) {

      console.error(error);

    });
}


/* =========================================================
   QR DETECTED
   ========================================================= */

function onScanSuccess(decodedText) {

  if (scanLocked) {
    return;
  }

  scanLocked = true;

  stopScanner()
    .then(function() {

      showProcessing(decodedText);

      sendAttendanceScan(decodedText);

    });
}


/* =========================================================
   QR SCAN FAILURE
   ========================================================= */

function onScanFailure(error) {

  // Normal while camera is searching.
}


/* =========================================================
   SHOW PROCESSING
   ========================================================= */

function showProcessing(qrText) {

  const lines =
    qrText
      .split(/\r?\n/)
      .map(function(line) {
        return line.trim();
      });

  document.getElementById(
    "admissionId"
  ).innerText =
    lines[0] || "";

  document.getElementById(
    "studentName"
  ).innerText =
    lines[1] || "";

  document.getElementById(
    "term"
  ).innerText =
    lines[2] || "";

  document.getElementById(
    "className"
  ).innerText =
    lines[3] || "";

  document.getElementById(
    "mode"
  ).innerText =
    lines[4] || "";

  document.getElementById(
    "subject"
  ).innerText = "";

  document.getElementById(
    "session"
  ).innerText = "";

  document.getElementById(
    "sessionTime"
  ).innerText = "";

  document.getElementById(
    "message"
  ).innerText =
    "Checking attendance...";

  document.getElementById(
    "subjectRow"
  ).style.display = "none";

  document.getElementById(
    "sessionRow"
  ).style.display = "none";

  document.getElementById(
    "sessionTimeRow"
  ).style.display = "none";

  const status =
    document.getElementById(
      "resultStatus"
    );

  status.className = "processing";
  status.innerText =
    "PROCESSING...";

  document.getElementById(
    "result"
  ).style.display = "block";
}


/* =========================================================
   SEND QR TO APPS SCRIPT
   ========================================================= */

function sendAttendanceScan(qrText) {

  const callbackName =
    "attendanceCallback_" +
    Date.now();

  window[callbackName] =
    function(result) {

      try {

        displayAttendanceResult(
          result
        );

      } finally {

        delete window[callbackName];

        const script =
          document.getElementById(
            callbackName
          );

        if (script) {
          script.remove();
        }
      }
    };


  const url =
    APPS_SCRIPT_URL +
    "?api=attendance" +
    "&qrText=" +
    encodeURIComponent(qrText) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  const script =
    document.createElement(
      "script"
    );

  script.id =
    callbackName;

  script.src = url;

  script.onerror =
    function() {

      delete window[callbackName];

      const result =
        document.getElementById(
          "resultStatus"
        );

      result.className =
        "rejected";

      result.innerText =
        "CONNECTION ERROR";

      document.getElementById(
        "message"
      ).innerText =
        "Could not contact the attendance system.";

      document.getElementById(
        "scanAgainButton"
      ).style.display =
        "block";
    };


  document
    .body
    .appendChild(script);
}


/* =========================================================
   DISPLAY ATTENDANCE RESULT
   ========================================================= */

function displayAttendanceResult(
  result
) {

  if (!result) {

    showRejected(
      "No response received from attendance system."
    );

    return;
  }


  const success =
    result.success === true;


  if (success) {

    const status =
      document.getElementById(
        "resultStatus"
      );

    status.className =
      "success";

    status.innerText =
      "✓ PRESENT";

    document.getElementById(
      "message"
    ).innerText =
      result.message || "Attendance recorded.";

  } else {

    const status =
      document.getElementById(
        "resultStatus"
      );

    status.className =
      "rejected";

    status.innerText =
      "✗ " +
      (
        result.status ||
        "REJECTED"
      );

    document.getElementById(
      "message"
    ).innerText =
      result.message ||
      "Attendance was not recorded.";
  }


  if (result.admissionId) {

    document.getElementById(
      "admissionId"
    ).innerText =
      result.admissionId;
  }


  if (result.studentName) {

    document.getElementById(
      "studentName"
    ).innerText =
      result.studentName;
  }


  if (result.term) {

    document.getElementById(
      "term"
    ).innerText =
      result.term;
  }


  if (result.className) {

    document.getElementById(
      "className"
    ).innerText =
      result.className;
  }


  if (result.modeOfExam) {

    document.getElementById(
      "mode"
    ).innerText =
      result.modeOfExam;
  }


  if (result.subject) {

    document.getElementById(
      "subject"
    ).innerText =
      result.subject;

    document.getElementById(
      "subjectRow"
    ).style.display =
      "block";
  }


  if (result.session) {

    document.getElementById(
      "session"
    ).innerText =
      "Session " +
      result.session;

    document.getElementById(
      "sessionRow"
    ).style.display =
      "block";
  }


  if (result.sessionTime) {

    document.getElementById(
      "sessionTime"
    ).innerText =
      result.sessionTime;

    document.getElementById(
      "sessionTimeRow"
    ).style.display =
      "block";
  }


  document.getElementById(
    "scanAgainButton"
  ).style.display =
    "block";
}


/* =========================================================
   REJECTED RESULT
   ========================================================= */

function showRejected(message) {

  const status =
    document.getElementById(
      "resultStatus"
    );

  status.className =
    "rejected";

  status.innerText =
    "✗ REJECTED";

  document.getElementById(
    "message"
  ).innerText =
    message;

  document.getElementById(
    "scanAgainButton"
  ).style.display =
    "block";
}


/* =========================================================
   SCAN NEXT STUDENT
   ========================================================= */

function scanAgain() {

  document.getElementById(
    "result"
  ).style.display =
    "none";

  document.getElementById(
    "scanAgainButton"
  ).style.display =
    "none";

  document.getElementById(
    "subjectRow"
  ).style.display =
    "none";

  document.getElementById(
    "sessionRow"
  ).style.display =
    "none";

  document.getElementById(
    "sessionTimeRow"
  ).style.display =
    "none";

  startScanner();
}

</script>

</body>
</html>
